<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Schriften liegen lokal in fonts/ (siehe @font-face in css/style.css) -->
<link rel="stylesheet" href="css/style.css">

<!-- Die Hooks (GameDetails, DownloadingFile, ...) muessen sofort existieren, daher im <head>. -->
<script src="js/config.js"></script>
<script src="js/loading.js"></script>
</head>
<body>

<div id="stage">

  <!-- ============ LOGO ============ -->
  <div class="logo" id="logo">
    <!-- Statisches Logo (keine Animation): Ellipse 400x400 + Schriftzug "TBTR" aus "Libre Barcode 128 Text" (als Pfad eingebettet) -->
    <svg class="mark" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="TBTR">
      <defs>
        <clipPath id="disc"><circle cx="200" cy="200" r="200"/></clipPath>
        <radialGradient id="discBg" cx="50%" cy="46%" r="60%">
          <stop offset="0" stop-color="#1f2540"/>
          <stop offset="1" stop-color="#1a182f"/>
        </radialGradient>
        <radialGradient id="glowYellow"><stop offset="0" stop-color="#7a6320" stop-opacity=".32"/><stop offset="1" stop-color="#7a6320" stop-opacity="0"/></radialGradient>
        <radialGradient id="glowPurple"><stop offset="0" stop-color="#4b36a0" stop-opacity=".26"/><stop offset="1" stop-color="#4b36a0" stop-opacity="0"/></radialGradient>
        <linearGradient id="ringGrad" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="360" y2="360">
          <stop offset="0"    stop-color="#f6e7a6"/>
          <stop offset="0.20" stop-color="#a99af2"/>
          <stop offset="0.50" stop-color="#7e66ec"/>
          <stop offset="0.80" stop-color="#b867dd"/>
          <stop offset="1"    stop-color="#8a73ee"/>
        </linearGradient>
        <!-- Balken: weiss-cyan oben -> Lavendel unten, Buchstaben: Grau-Blau -->
        <linearGradient id="glyphGrad" gradientUnits="userSpaceOnUse" x1="0" y1="102" x2="0" y2="284">
          <stop offset="0"     stop-color="#f4ffff"/>
          <stop offset="0.07"  stop-color="#bbd5f8"/>
          <stop offset="0.20"  stop-color="#a9c0fd"/>
          <stop offset="0.35"  stop-color="#98b0fb"/>
          <stop offset="0.50"  stop-color="#8296e0"/>
          <stop offset="0.645" stop-color="#6e84c4"/>
          <stop offset="0.66"  stop-color="#aab2c8"/>
          <stop offset="1"     stop-color="#737b94"/>
        </linearGradient>
      </defs>

      <g clip-path="url(#disc)">
        <circle cx="200" cy="200" r="200" fill="url(#discBg)"/>
        <circle cx="300" cy="330" r="110" fill="url(#glowYellow)"/>
        <circle cx="80" cy="300" r="120" fill="url(#glowPurple)"/>
      </g>

      <path fill="url(#glyphGrad)" d="M68 220V102H80V220ZM86 220V102H104V220ZM122 220V102H128V220ZM97.8 242H84.8V237.4H116.8V242H103.2V283.8H97.8Z M134 220V102H140V220ZM158 220V102H164V220ZM170 220V102H182V220ZM152 237.4H165.2Q172.8 237.4 176.6 240.4Q180.6 243.4 180.6 248.8Q180.6 252.2 178.8 255Q176.8 257.8 173.6 259Q177.6 260.4 180 263.6Q182.4 267 182.4 270.8Q182.4 276.8 178 280.4Q173.8 283.8 165 283.8H152ZM164.4 256.6Q175.4 256.6 175.4 249.2Q175.4 246 172.8 244Q170.4 241.8 165.2 241.8H157V256.6ZM166 279.2Q176.8 279.2 176.8 270.4Q176.8 261 164.6 261H157V279.2Z M200 220V102H212V220ZM218 220V102H236V220ZM254 220V102H260V220ZM229.8 242H216.8V237.4H248.8V242H235.2V283.8H229.8Z M266 220V102H278V220ZM296 220V102H302V220ZM308 220V102H326V220ZM284.6 237.4H298.2Q306.2 237.4 309.8 241Q313.6 244.4 313.6 250.8Q313.6 254.8 311 258.4Q308.4 262 304.2 263.2L315 283.8H309.2L298.8 263.4H289.8V283.8H284.6ZM298.8 258.8Q303.6 258.8 306 256.6Q308.2 254.6 308.2 250.8Q308.2 247 306 244.6Q303.6 242.4 298.8 242.4H289.8V258.8Z"/>

      <!-- helle Glaskante links an jedem Balken -->
      <g fill="#fff" opacity=".8">
        <rect x="68" y="102" width="1.4" height="118"/>
        <rect x="86" y="102" width="1.4" height="118"/>
        <rect x="122" y="102" width="1.4" height="118"/>
        <rect x="134" y="102" width="1.4" height="118"/>
        <rect x="158" y="102" width="1.4" height="118"/>
        <rect x="170" y="102" width="1.4" height="118"/>
        <rect x="200" y="102" width="1.4" height="118"/>
        <rect x="218" y="102" width="1.4" height="118"/>
        <rect x="254" y="102" width="1.4" height="118"/>
        <rect x="266" y="102" width="1.4" height="118"/>
        <rect x="296" y="102" width="1.4" height="118"/>
        <rect x="308" y="102" width="1.4" height="118"/>
      </g>

      <circle cx="200" cy="200" r="198" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
    </svg>

    <img class="logo-img" id="logoImg" alt="" style="display:none">
  </div>

  <!-- ============ LINKS UNTEN ============ -->
  <div class="row sync" id="syncRow">
    <span class="sync-text" id="syncText">Synchronizing Data, please wait</span><span class="spinner" aria-hidden="true">
      <svg viewBox="0 0 26 26" width="100%" height="100%">
        <!-- weisse Spur: von 171 deg einmal im Uhrzeigersinn herum bis ~66 deg (Luecke unten links) -->
        <circle cx="13" cy="13" r="11" fill="none" stroke="#6a53b4" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="17.1 52" transform="rotate(211 13 13)"/>
        <circle cx="13" cy="13" r="11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="52 17.1" transform="rotate(-60 13 13)"/>
      </svg>
    </span>
  </div>

  <div class="bar" id="bar">
    <div class="fill" id="fill"></div>
    <div class="bevel"></div>
  </div>

  <div class="row download" id="downloadRow">
    <span id="downloadText">Downloading: Item Name - GB/MB - GB/MB</span>
  </div>

  <!-- ============ RECHTS UNTEN ============ -->
  <div class="player" id="player">
    <div class="np-title" id="npTitle">Now Playing : Title Name - Artist Name</div>
    <div class="np-time"><span id="npCur">00:00</span><b>|</b><span id="npDur">00:00</span></div>
    <div class="np-line"><div class="np-fill" id="npFill"></div></div>
  </div>

  <div class="row status" id="statusRow">
    <span class="pipe">|</span> <span id="statusText">CURRENT LOADING STATUS</span> <span class="pipe">|</span><span class="percent" id="percent">PERCENTAGE</span>
  </div>

</div>

<audio id="bgm" preload="auto"></audio>

<script src="js/music.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
